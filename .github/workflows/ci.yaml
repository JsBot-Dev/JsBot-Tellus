name: CI
on:
    push:
        branches: ['*']
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run check

            - name: Format Check
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Dependencies Check
              run: npm audit --omit=dev --audit-level=high

            - name: Test
              run: npm test

            - name: Smoke
              run: node dist/app.js --help

            - name: External plugin smoke
              run: node --input-type=module -e "import { loadPluginsFromDirectory } from './dist/core/plugin/loader.js'; const plugins = await loadPluginsFromDirectory('./examples/plugins'); if (!plugins.some((plugin) => plugin.manifest.id === 'hello')) process.exit(1)"

    docker:
        name: docker
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Validate compose example
              run: docker compose -f compose.example.yaml config >/dev/null

            - name: Setup buildx
              uses: docker/setup-buildx-action@v3

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: false
                  load: true
                  tags: jsbot-tellus:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true

            - name: CLI smoke
              run: docker run --rm jsbot-tellus:ci --help

            - name: Runtime smoke
              run: |
                  docker run --rm --entrypoint node jsbot-tellus:ci -e "const fs = require('node:fs'); if (!fs.existsSync('/app/dist/webui/index.html')) process.exit(1); console.log('webui ok')"
                  docker run --rm --entrypoint node jsbot-tellus:ci -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.exec('create table t (id integer)'); db.close(); console.log('sqlite ok')"
