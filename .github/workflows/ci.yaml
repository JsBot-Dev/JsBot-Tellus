name: CI
on:
    push:
        branches: ['*']
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run check

            - name: Format Check
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Dependencies Check
              run: npm audit --omit=dev --audit-level=high

            - name: Test
              run: npm test

            - name: Smoke
              run: node dist/app.js --help

            - name: External plugin smoke
              run: node --input-type=module -e "import { loadPluginsFromDirectory } from './dist/core/plugin/loader.js'; const plugins = await loadPluginsFromDirectory('./examples/plugins'); if (!plugins.some((plugin) => plugin.manifest.id === 'hello')) process.exit(1)"
