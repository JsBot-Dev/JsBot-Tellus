name: CI
on:
    push:
        branches: ['*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Ensure npm supports trusted publishing
              run: npm install --global 'npm@^11.5.1'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run check

            - name: Format Check
              run: npm run format:check

            - name: Dependencies Check
              run: npm audit --omit=dev --audit-level=high

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Smoke
              run: node dist/app.js --help

            - name: External plugin smoke
              run: node --input-type=module -e "import { loadPluginsFromDirectory } from './dist/core/plugin/loader.js'; const plugins = await loadPluginsFromDirectory('./examples/plugins'); if (!plugins.some((plugin) => plugin.manifest.id === 'hello')) process.exit(1)"

            - name: Publish to npm
              if: ${{ github.repository == 'JsBot-Dev/JsBot-Tellus' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if npm view "@jsbot-tellus/core@$version" version >/dev/null 2>&1; then
                      echo "::notice::@jsbot-tellus/core@$version is already published, skipping"
                      exit 0
                  fi
                  npm publish --provenance --access public
