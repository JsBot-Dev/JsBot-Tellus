name: CI
on:
    push:
        branches: ['*']
    pull_request:
        branches: [main]

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run check

            - name: Format Check
              run: npm run format:check

            - name: Test
              run: npm test
