name: CD

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: [main]

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        name: publish
        if: ${{ github.repository == 'JsBot-Dev/JsBot-Tellus' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out tested commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Ensure npm supports trusted publishing
              run: npm install --global 'npm@^11.5.1'

            - name: Install dependencies
              run: npm ci

            # 必须先 build：publish 的 prepublishOnly（check + test）里
            # 含 webui-csp 测试，它从 dist/webui 读取内联 bootstrap 计算
            # CSP——和 ci.yaml「Test 排在 Build 之后」是同一个约束。
            - name: Build
              run: npm run build

            - name: Publish to npm
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if npm view "@jsbot-tellus/core@$version" version >/dev/null 2>&1; then
                      echo "::notice::@jsbot-tellus/core@$version is already published, skipping"
                      exit 0
                  fi
                  npm publish --provenance --access public
